name: Deploy IELTS Focus

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare in-app textbooks and mobile audio
        shell: bash
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils ffmpeg >/dev/null
          mkdir -p /tmp/ielts-pdf /tmp/ielts-mp3 study-pages media

          gh release download materials-v1 --repo "$REPO" --pattern "asset-0001.pdf" --dir /tmp/ielts-pdf
          gh release download materials-v1 --repo "$REPO" --pattern "asset-0027.pdf" --dir /tmp/ielts-pdf
          gh release download materials-v1 --repo "$REPO" --pattern "asset-0151.pdf" --dir /tmp/ielts-pdf
          gh release download materials-v1 --repo "$REPO" --pattern "asset-0276.pdf" --dir /tmp/ielts-pdf
          gh release download materials-v1 --repo "$REPO" --pattern "asset-*.mp3" --dir /tmp/ielts-mp3

          render_pdf () {
            local src="$1"
            local prefix="$2"
            local tmp="/tmp/render-$prefix"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            pdftoppm -jpeg -r 100 -jpegopt quality=68,optimize=y "$src" "$tmp/page"
            n=1
            for f in "$tmp"/page-*.jpg; do
              printf -v num "%03d" "$n"
              mv "$f" "study-pages/${prefix}-${num}.jpg"
              n=$((n+1))
            done
          }

          render_pdf /tmp/ielts-pdf/asset-0001.pdf c21
          render_pdf /tmp/ielts-pdf/asset-0027.pdf blu
          render_pdf /tmp/ielts-pdf/asset-0151.pdf blu2
          render_pdf /tmp/ielts-pdf/asset-0276.pdf be

          transcode_one () {
            src="$1"
            base="$(basename "$src")"
            out="media/$base"
            if ! ffmpeg -y -loglevel error -i "$src" -map_metadata -1 -ac 1 -ar 44100 -b:a 64k "$out"; then
              cp "$src" "$out"
            fi
          }
          export -f transcode_one
          find /tmp/ielts-mp3 -type f -name '*.mp3' -print0 | xargs -0 -n1 -P4 bash -c 'transcode_one "$0"'

          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          pages=Counter(p.name.split("-")[0] for p in Path("study-pages").glob("*.jpg"))
          mp3=list(Path("media").glob("*.mp3"))
          total=sum(p.stat().st_size for p in mp3)+sum(p.stat().st_size for p in Path("study-pages").glob("*.jpg"))
          print("study pages:", dict(pages))
          print("mobile audio:", len(mp3), "files")
          print("published media bytes:", total)
          assert pages["c21"] == 146
          assert pages["blu"] == 278
          assert pages["be"] >= 160
          assert pages["blu2"] > 100
          assert len(mp3) >= 275
          assert total < 950_000_000, "Published media would exceed safe GitHub Pages size"
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
