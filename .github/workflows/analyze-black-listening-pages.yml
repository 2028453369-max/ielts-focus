name: Analyze Black Eyes Lower PDF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-black-listening-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update >/dev/null && sudo apt-get install -y poppler-utils >/dev/null
      - name: Find unit start pages
        shell: bash
        run: |
          mkdir -p /tmp/pdf
          gh release download materials-v1 --repo "$REPO" --pattern "asset-0151.pdf" --dir /tmp/pdf
          python - <<'PY'
          import subprocess,re,json
          pdf="/tmp/pdf/asset-0151.pdf"
          units=["One","Two","Three","Four","Five","Six"]
          results={u:[] for u in units}
          for p in range(1,260):
              txt=subprocess.run(["pdftotext","-f",str(p),"-l",str(p),"-layout",pdf,"-"],capture_output=True,text=True,errors="ignore").stdout
              norm=" ".join(txt.split())
              head=" ".join(txt.splitlines()[:12])
              for u in units:
                  if re.search(rf"\bUnit\s+{u}\b", norm, re.I):
                      results[u].append({"page":p,"head":head[:260]})
          print("UNIT_CANDIDATES_JSON="+json.dumps(results,ensure_ascii=False))
          PY
