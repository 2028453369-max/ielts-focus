name: Unpack IELTS Materials

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process"
        required: true
        default: "materials-v1"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Choose release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install 7-Zip
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Download archive assets
        shell: bash
        run: |
          mkdir -p work
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --pattern "*.7z" \
            --dir work

          COUNT="$(find work -maxdepth 1 -type f \( -name '*.zip' -o -name '*.7z' \) | wc -l)"
          if [ "$COUNT" -eq 0 ]; then
            echo "No ZIP or 7Z assets found in release."
            exit 1
          fi
          echo "Found $COUNT archive asset(s)."

      - name: Unpack all archives
        shell: bash
        run: |
          mkdir -p extracted upload
          while IFS= read -r f; do
            echo "Unpacking $f"
            case "$f" in
              *.zip) unzip -q -o "$f" -d extracted ;;
              *.7z)  7z x -y -oextracted "$f" >/dev/null ;;
            esac
          done < <(find work -maxdepth 1 -type f \( -name '*.zip' -o -name '*.7z' \) | sort)

      - name: Build upload assets and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, mimetypes, shutil, hashlib

          root = Path("extracted")
          out = Path("upload")
          out.mkdir(exist_ok=True)

          manifest = []
          files = [p for p in root.rglob("*") if p.is_file()]
          files.sort(key=lambda p: str(p.relative_to(root)).lower())

          for i, p in enumerate(files, 1):
              rel = str(p.relative_to(root)).replace("\\", "/")
              ext = p.suffix.lower()
              asset = f"asset-{i:04d}{ext}"
              target = out / asset
              shutil.copy2(p, target)
              h = hashlib.sha256()
              with p.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              manifest.append({
                  "path": rel,
                  "name": p.name,
                  "asset": asset,
                  "size": p.stat().st_size,
                  "mime": mimetypes.guess_type(p.name)[0] or "application/octet-stream",
                  "sha256": h.hexdigest()
              })

          (out / "materials-manifest.json").write_text(
              json.dumps({"version": 1, "files": manifest}, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Prepared {len(files)} files")
          PY

      - name: Upload unpacked assets to the same release
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for f in upload/*; do
            gh release upload "$TAG" "$f" \
              --repo "${{ github.repository }}" \
              --clobber
          done
