<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Focus 更新</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f8f7;color:#1f2d28}
.wrap{max-width:520px;margin:12vh auto;padding:24px}
.card{background:#fff;border:1px solid #dfe7e3;border-radius:16px;padding:24px;box-shadow:0 8px 28px rgba(21,50,40,.08)}
h1{font-size:22px;margin:0 0 12px}.muted{color:#64746d;line-height:1.7}.ok{margin-top:16px;font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>正在更新 IELTS Focus</h1>
<div class="muted">正在清除旧版网页缓存，并切换到云端资料版本。通常只需要几秒。</div>
<div class="ok" id="status">处理中…</div>
</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.textContent='更新完成，正在重新打开…';
  }catch(e){
    status.textContent='正在重新打开…';
  }
  const v=Date.now();
  setTimeout(()=>location.replace('./?fresh='+v),700);
})();
</script>
</body>
</html>
